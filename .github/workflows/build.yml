name: Build & Release APK

# Every push to main builds the APK and publishes it as a GitHub Release
# tagged v<version.txt>. Bump version.txt to make a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Read version
        run: echo "VERSION=$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret set; using the repo's bundled signing key."
          fi

      - name: Test & build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|ERROR|FAILED|What went wrong|Exception" -A3 build.log | head -c 50000; echo; echo '---- tail ----'; tail -c 12000 build.log; echo '```'; } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md

      - name: Rename APK
        run: |
          NAME="AC-Remote-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AC Remote v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ env.APK_NAME }}
          body: |
            ## Download
            Tap **${{ env.APK_NAME }}** below, open it on your phone, and allow "Install unknown apps" when asked.

            Needs a phone with an IR blaster (Xiaomi / Redmi / POCO, Huawei, many Infinix & Tecno).
            First try **Power**. If the AC doesn't react, open ⚙ Settings → switch to **Type B** → tap **Test**.
